[package]
name = "localgpt-md"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "LocalGPT MD — open a Markdown file and walk through it as a 3D world"
repository = "https://github.com/localgpt-app/localgpt-md"

# Its own workspace root, so a checkout nested inside another Cargo workspace
# (say, beside other Rust projects in a monorepo) is never absorbed into it.
[workspace]

[dependencies]
# `system_font_discovery` lets parley/fontique fall back to OS fonts, so CJK
# and other non-Latin headings render instead of showing as blank boxes.
bevy = { version = "0.19", features = ["system_font_discovery"] }

# Markdown → sections. Parsing only; the `html` renderer isn't needed.
pulldown-cmark = { version = "0.13", default-features = false }

# The shared LocalGPT world format: the data model (serde-only), the one Bevy
# mapping every LocalGPT app renders with, and the web viewer / HTML export.
# Pinned to a localgpt commit until the next crates.io release publishes the
# soundtrack/modulation types and the two new crates; switch these back to
# plain version requirements (`"0.3.7"`) then. A commit pin, not a branch, so
# it survives the branch being merged and deleted.
localgpt-world-types = { git = "https://github.com/localgpt-app/localgpt", rev = "6825213b4485d345175aa3fe199cb53fd8fea457" }
localgpt-world-bevy = { git = "https://github.com/localgpt-app/localgpt", rev = "6825213b4485d345175aa3fe199cb53fd8fea457" }
localgpt-world-export = { git = "https://github.com/localgpt-app/localgpt", rev = "6825213b4485d345175aa3fe199cb53fd8fea457" }

# `--print-ron` / `--export x.ron`: the same serializer and version Gen uses
# for world.ron.
ron = "0.12.1"

# Stable per-section content hashes (seed the draft now; cache keys later).
blake3 = "1"

# LLM-authored recipes (src/recipe.rs) and the sidecar cache (src/sidecar.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The LLM recipe tier (PLAN.md M1): plain instructed-JSON generation through
# mistral.rs, ported from LocalGPT Verse. No `schemars` on purpose —
# grammar-constrained generation hangs on GGUF (mistral.rs 0.8), so nothing
# uses a schema; safety is RegionRecipe::clamped + the lenient parse.
llm = ["dep:mistralrs", "dep:tokio"]
# Apple-Silicon GPU path for the ~5 GB Q4_K_M (macOS-only; the CPU device
# map can't hold it beside a renderer — same rule as Verse).
llm-metal = ["llm", "mistralrs/metal"]

[dependencies.mistralrs]
version = "0.8"
optional = true

# Drives each generation's block_on runtime + timeout (mistral.rs is async).
[dependencies.tokio]
version = "1"
features = ["rt", "time"]
optional = true

# Bevy's recommended dev profile: optimize dependencies but keep fast rebuilds
# of our own crate.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
